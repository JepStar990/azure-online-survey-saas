name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  # --- Deploy infrastructure ---
  deploy-infra:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Bicep
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          az deployment group create \
            -g $AZURE_RESOURCE_GROUP \
            --template-file infra/main.bicep \
            --parameters \
              webAppName=${{ secrets.AZURE_WEBAPP_NAME }} \
              storageAccountName=${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              sqlServerName=${{ secrets.AZURE_SQL_SERVER_NAME }} \
              sqlAdministratorLogin=${{ secrets.AZURE_SQL_ADMIN_USER }} \
              sqlAdministratorPassword=${{ secrets.AZURE_SQL_ADMIN_PASSWORD }} \
              sqlDatabaseName=${{ secrets.AZURE_SQL_DB_NAME }} \
              appInsightsName=${{ secrets.AZURE_APPINSIGHTS_NAME }} \
              keyVaultName=${{ secrets.AZURE_KEYVAULT_NAME }}

  # --- Deploy backend ---
  deploy-backend:
    needs: [deploy-infra]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish backend
        run: |
          dotnet publish backend/src/SurveyApi.Web/SurveyApi.Web.csproj \
            -c Release -o publish
      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          slot-name: staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
      - name: Smoke test staging
        run: |
          curl -sf https://${{ secrets.AZURE_WEBAPP_NAME }}-staging.azurewebsites.net/api/v1/health
      - name: Swap slots
        run: |
          az webapp deployment slot swap \
            -g ${{ secrets.AZURE_RESOURCE_GROUP }} \
            -n ${{ secrets.AZURE_WEBAPP_NAME }} \
            --slot staging --target-slot production

  # --- Deploy frontend ---
  deploy-frontend:
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Deploy to Storage
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          az storage blob upload-batch \
            -s frontend/dist -d '$web' \
            --account-name $AZURE_STORAGE_ACCOUNT \
            --account-key $AZURE_STORAGE_KEY \
            --overwrite

  # --- Post-deploy smoke tests ---
  smoke-tests:
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/v1/health; then
              echo "Deployment verified."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 5 minutes."
          exit 1
