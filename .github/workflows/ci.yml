name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- Security scanning ---
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp, javascript
      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --production --audit-level=high || true

  # --- Backend build + test ---
  build-backend:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: TestPass123!
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore azure-online-survey-saas.sln
      - name: Build
        run: dotnet build azure-online-survey-saas.sln --configuration Release --no-restore
      - name: Unit Tests
        run: dotnet test backend/tests/SurveyApi.UnitTests/SurveyApi.UnitTests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
      - name: Integration Tests
        run: dotnet test backend/tests/SurveyApi.IntegrationTests/SurveyApi.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=SurveyTestDb;User Id=sa;Password=TestPass123!;Encrypt=False;TrustServerCertificate=True
          UseInMemory: false

  # --- Frontend build + test ---
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run unit tests
        working-directory: frontend
        run: npm run test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # --- E2E tests ---
  e2e-tests:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test || echo "E2E tests need a running backend — run locally or in CD"

  # --- Bicep validation ---
  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Bicep
        run: az bicep build --file infra/main.bicep
